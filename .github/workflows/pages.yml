name: Publish demo to gh-pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/ to the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r docs /tmp/site
          git checkout --orphan gh-pages
          git rm -rfq .
          cp -r /tmp/site/. .
          touch .nojekyll
          git add -A
          git commit -qm "Publish demo from ${GITHUB_SHA::7}"
          git push -f origin gh-pages
