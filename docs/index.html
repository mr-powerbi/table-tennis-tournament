<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turniej Tenisa Stołowego</title>
<meta name="description" content="Aplikacja do prowadzenia firmowego turnieju ping-ponga: zapisy po linku, dwie rundy kwalifikacji, Lucky Losers, drabinka, podium i statystyki.">

<meta property="og:type" content="website">
<meta property="og:title" content="🏓 Turniej Tenisa Stołowego">

<meta property="og:image" content="https://mr-powerbi-data.pl/table-tennis-tournament/og.jpg">

<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Układ: jedna kolumna jak program meczowy; koralowy akcent, brzoskwiniowa mgiełka w nagłówku. */
:root{
  --bg:#FFFFFF; --surface:#FAF6F3; --card:#FFFFFF; --ink:#232120; --muted:#6E6662; --line:#EDE4DE;
  --coral:#EC6A55; --coral-deep:#D9533E; --on-coral:#FFFFFF; --peach:#F6B28A; --peach-soft:#FDEEE5;
  --win:#1F7A4D; --win-soft:#E5F4EC; --warn:#9A6200; --warn-soft:#FFF3D6;
  --gold:#C99A2E; --silver:#8E98A3; --bronze:#B06D3E;
  --f-display:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141211; --surface:#1C1917; --card:#211D1B; --ink:#F4EFEB; --muted:#A99F99; --line:#342E2B;
    --coral:#F27B66; --coral-deep:#F58E7B; --on-coral:#1A1110; --peach:#C9805A; --peach-soft:#2A1E19;
    --win:#5BD39A; --win-soft:#17271F; --warn:#F2C062; --warn-soft:#2B2414;
    --gold:#E2B850; --silver:#B7C0CA; --bronze:#D58D5C; color-scheme:dark; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.hero{position:relative;overflow:hidden;padding-block:28px 34px;background:
  radial-gradient(120% 90% at 100% 110%, color-mix(in srgb,var(--peach) 70%, transparent) 0%, transparent 60%),
  radial-gradient(80% 70% at 85% 40%, color-mix(in srgb,var(--peach) 35%, transparent) 0%, transparent 70%), var(--bg);
  border-bottom:1px solid var(--line)}
.hero .wrap{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--coral);letter-spacing:.01em}
.brand svg{width:30px;height:30px}
.eyebrow{margin-top:26px;font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.hero h1{margin-top:8px;font-size:clamp(1.9rem,6.4vw,3.5rem);font-weight:800;letter-spacing:-.025em;max-width:16ch}
.hero h1 em{font-style:normal;color:var(--coral)}
.meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%, transparent);border:1px solid var(--line);font-size:.86rem;color:var(--ink)}
.ball{position:absolute;right:-30px;top:30px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff, #ffe9dc 45%, var(--peach) 100%);opacity:.55;pointer-events:none}
@media (prefers-color-scheme: dark){ .ball{opacity:.18} }

.steps{display:flex;gap:6px;overflow-x:auto;padding-block:16px;scrollbar-width:none}
.step{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.step.on{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.step.done{color:var(--ink)}
.step.done::before{content:"✓ ";color:var(--win)}

main{display:grid;gap:28px;padding-block:8px 48px}
main>*{min-width:0}
section > h2{font-size:1.45rem;font-weight:800;letter-spacing:-.015em}
.sechead h2{font-size:1.45rem;font-weight:800;letter-spacing:-.015em}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.sechead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:14px}

.join{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.join input{flex:1 1 220px;min-width:0;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.05rem}
.join input:focus-visible{outline:none;border-color:var(--coral);box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 22%, transparent)}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--coral);color:var(--on-coral);transition:transform .08s, background .15s}
.btn:hover{background:var(--coral-deep)}
.btn:active{transform:scale(.98)}
.btn:focus-visible, .ghost:focus-visible, .match:focus-visible, .opt:focus-visible{outline:3px solid color-mix(in srgb,var(--coral) 55%, transparent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ghost{appearance:none;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
.ghost:hover{border-color:var(--coral);color:var(--coral)}
.small{padding:7px 11px;font-size:.88rem;border-radius:10px}
.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding:0;list-style:none}
.players li{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.players li.me{background:var(--peach-soft);border-color:color-mix(in srgb,var(--coral) 45%, var(--line))}
.players .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:500}
.x{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:0 2px}
.x:hover{color:var(--coral)}
.notice{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.93rem}
.notice.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%, transparent);color:var(--ink)}
.big{font-size:2.4rem;font-weight:800;font-family:var(--f-display);letter-spacing:-.03em;line-height:1}

details.how{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:4px 16px}
details.how summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"＋";float:right;color:var(--coral)}
details.how[open] summary::after{content:"－"}
.how ol{margin:0 0 14px;padding-left:20px;display:grid;gap:6px;max-width:66ch}

.pools{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.poolhead{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:10px;font-size:1.02rem}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.tag.ll{background:var(--peach-soft);color:var(--coral-deep);border-color:color-mix(in srgb,var(--coral) 35%, transparent)}
.mlist{display:grid;gap:8px}
.match{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.match:hover{border-color:color-mix(in srgb,var(--coral) 50%, var(--line))}
.match.mine{box-shadow:inset 3px 0 0 var(--coral)}
.match.locked{cursor:default}
.match.locked:hover{border-color:var(--line)}
.match .p{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.match .p.w{font-weight:800}
.match .p.tbd{color:var(--muted);font-style:italic;font-weight:400}
.match .s{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;min-width:1.4ch;text-align:right}
.match .s.w{color:var(--coral)}
.match .cta{grid-column:1/-1;font-size:.8rem;color:var(--coral);font-weight:700;margin-top:2px}
.match .note{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:2px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;background:var(--surface)}
td.num,th.num{text-align:right;font-family:var(--f-mono)}
tr.cut td{border-bottom:2px dashed var(--coral)}
tr.in td:first-child{color:var(--coral);font-weight:800}
tr.tie td{background:var(--warn-soft)}
tr.llz td:nth-child(2)::after{content:' · LL';color:var(--coral);font-weight:700;font-size:.8em}
tr.me td{font-weight:800}
.cutlabel{font-size:.78rem;color:var(--coral);font-weight:700;margin-top:8px}

.bracket{overflow-x:auto;padding-bottom:6px}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:18px;min-width:min-content}
.col{display:flex;flex-direction:column}
.col h3, h3.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;font-weight:700}
.col .slots{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.col.final .match{border-color:var(--coral);border-width:1.5px}
.third{margin-top:16px;max-width:300px}

.podium-sec{border-radius:22px;padding:26px 16px 22px;background:
  radial-gradient(100% 80% at 50% 120%, color-mix(in srgb,var(--peach) 60%, transparent) 0%, transparent 65%), var(--surface);border:1px solid var(--line);text-align:center}
.podium-sec h2{font-size:clamp(1.6rem,5vw,2.4rem)}
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;align-items:end;gap:10px;margin-top:22px;max-width:640px;margin-inline:auto}
.place{display:flex;flex-direction:column;align-items:center;min-width:0}
.wreath{position:relative;width:100%;max-width:170px;aspect-ratio:1}
.wreath svg{width:100%;height:100%;display:block}
.wreath .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,7vw,3rem)}
.pname{font-weight:800;font-size:clamp(.95rem,3.4vw,1.25rem);margin-top:6px;max-width:100%;overflow-wrap:anywhere;line-height:1.15}
.plabel{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-top:4px}
.block{width:100%;border-radius:12px 12px 4px 4px;margin-top:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--on-coral)}
.p1 .block{height:92px;background:var(--coral)}
.p2 .block{height:64px;background:color-mix(in srgb,var(--coral) 62%, var(--surface))}
.p3 .block{height:44px;background:color-mix(in srgb,var(--coral) 38%, var(--surface))}
.p2 .block,.p3 .block{color:var(--ink)}
.p1 .wreath{max-width:200px}
.handshake{margin-top:18px;font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){
  .podium-sec .place{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .podium-sec .p2{animation-delay:.12s} .podium-sec .p3{animation-delay:.24s}
  @keyframes rise{from{transform:translateY(16px);opacity:.2}to{transform:none;opacity:1}}
}

details.statsbox .stats{margin-bottom:16px}
.match .ticking{color:var(--coral-deep);font-weight:700}
.timing{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.setgrid{display:grid;gap:8px;margin:12px 0 4px}
.setrow{display:grid;grid-template-columns:3.4em 1fr auto 1fr;gap:8px;align-items:center}
.setrow[hidden]{display:none}
.setrow.head{font-weight:700;font-size:.85rem;color:var(--muted)}
.setrow.head b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.setrow input{width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:1.3rem;text-align:center;padding:10px 6px}
.setrow .sn{color:var(--muted);font-size:.78rem;font-weight:700}
.setrow .sep{color:var(--muted);font-weight:700}
.setsum{font-weight:800;margin-top:8px;min-height:1.4em}
.setpts{font-family:var(--f-body);font-size:.74rem;color:var(--muted);font-weight:400;white-space:nowrap}
.match .setsnote{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:2px;font-family:var(--f-mono)}
.stt{font-size:.82rem;font-weight:700;white-space:nowrap}
.st-in{color:var(--win)}
.st-ll{color:var(--coral)}
.st-out{color:var(--muted);font-weight:600}
tr.out td{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);align-self:start}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:.82rem;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--coral);color:var(--on-coral)}
.topfix{position:fixed;top:14px;right:14px;z-index:60;display:flex;gap:8px;align-items:center}
.topfix .btn{box-shadow:0 6px 20px rgba(0,0,0,.28)}
.topfix [hidden]{display:none}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.langsw button{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:.8rem;padding:8px 11px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--coral);color:var(--on-coral)}
@media(max-width:480px){.topfix .long{display:none}}
.topfix .ghost{background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.2)}
#howto{scroll-margin-top:70px}
dialog#adm{width:min(760px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto}
#adm .admhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 16px 0}
#adm .admhead h2{font-size:1.2rem}
#adm .admin{border:0;border-radius:0;background:transparent}
dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100% - 32px));background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,15,12,.45)}
.dlg{padding:20px}
.dlg h3{font-size:1.2rem}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:16px 0;text-align:center;font-weight:800}
.vs span:nth-child(2){color:var(--muted);font-weight:600;font-size:.85rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;cursor:pointer;display:grid;gap:2px}
.opt b{font-family:var(--f-mono);font-size:1.25rem}
.opt small{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.sel{border-color:var(--coral);background:var(--peach-soft)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.err{color:var(--coral-deep);font-weight:600;font-size:.9rem;margin-top:10px;min-height:1.2em}

.admin{border:1.5px dashed color-mix(in srgb,var(--coral) 60%, var(--line));border-radius:var(--r);padding:16px;display:grid;gap:14px;background:var(--surface)}
.admin h2{font-size:1.15rem}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
label.f{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
label.f input,label.f select{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-width:0;width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.danger{color:var(--coral-deep);border-color:color-mix(in srgb,var(--coral) 40%, var(--line))}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px);z-index:20}
footer{color:var(--muted);font-size:.82rem;padding-block:0 32px;text-align:center}
.qbox{border:1.5px solid color-mix(in srgb,var(--win) 45%, var(--line));background:var(--win-soft);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.qbox h2{font-size:1.3rem}
.qlist{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.qlist li{padding:7px 12px;border-radius:999px;font-weight:700;background:var(--card);border:1.5px solid color-mix(in srgb,var(--win) 55%, var(--line))}
.qlist.maybe li{font-weight:600;border-style:dashed;border-color:var(--line)}
.qlbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.qlbl.ok{color:var(--win)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);display:grid;gap:4px;align-content:start;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.stat .w{font-weight:700;overflow-wrap:anywhere}
.stat .d{font-size:.85rem;color:var(--muted)}
.stat.hot{background:var(--peach-soft);border-color:color-mix(in srgb,var(--coral) 40%, var(--line))}
.stat.hot .v{color:var(--coral)}
.demo{border:1.5px solid color-mix(in srgb,var(--coral) 45%, var(--line));background:var(--peach-soft);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px;font-size:.95rem}
footer a{color:inherit}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--win)}
.live.off::before{background:var(--muted)}
</style>
</head>
<body>
<header class="hero">
  <div class="ball" aria-hidden="true"></div>
  <div class="wrap">
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="17" cy="16" rx="11" ry="12" transform="rotate(-38 17 16)" fill="currentColor"/><path d="M23 25 l9 9" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="9" r="4" fill="currentColor" opacity=".55"/></svg>ping-pong</div>
    <div class="eyebrow" id="edition">Edycja 2026</div>
    <h1 id="title">Firmowy Turniej <em>Tenisa Stołowego</em></h1>
    <div class="meta" id="meta"></div>
  </div>
</header>
<div class="wrap"><nav class="steps" id="steps" aria-label="Etapy turnieju"></nav></div>

// Tryb demo: na GitHub Pages, z pliku albo z ?demo działa silnik w przeglądarce (engine.js) zamiast serwera.
let DEMO=/\.github\.io$/.test(location.hostname)||location.protocol==='file:'||new URLSearchParams(location.search).has('demo');
async function demoBoot(){
  if(TTEngine.hasState()) return;
  try{ const r=await fetch('demo-data.json'); TTEngine.loadState(await r.json()); }
  catch(e){ TTEngine.freshWithPlayers(DEMO_NAMES); }
}
const EXTRA_NAMES=['Michał S.','Natalia B.','Oskar D.','Weronika K.','Adrian L.','Julia P.','Dominik R.','Alicja M.','Sebastian T.','Magda Z.','Karol W.','Iza H.'];
function randomTournament(){
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const n=rnd(6,32), pool=[...DEMO_NAMES,...EXTRA_NAMES];
  for(let i=pool.length-1;i>0;i--){ const j=rnd(0,i); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  TTEngine.freshWithPlayers(pool.slice(0,n));
  const sets=[1,1,1,2,3][rnd(0,4)];
  const ks=[2,4,8,16,32].filter(k=>k<=Math.max(2,n)&&k<n);
  const settings={action:'settings',setsToWin:sets,scoreMode:Math.random()<.65?'points':'sets',koSize:Math.random()<.5||!ks.length?null:ks[rnd(0,ks.length-1)]};
  try{ TTEngine.request('api/admin',settings); }catch(e){ TTEngine.request('api/admin',{action:'settings',setsToWin:sets}); }
  const K=TTEngine.request('api/state').K, lls=[1,2,3,4,5,6,7,8].filter(v=>v<=Math.min(K,Math.max(1,n-K)));
  if(lls.length&&Math.random()<.5){ try{ TTEngine.request('api/admin',{action:'settings',llSpots:lls[rnd(0,lls.length-1)]}); }catch(e){} }
  const st=TTEngine.request('api/admin',{action:'draw'});
  randomTournament.info={n,sets:st.setsToWin,K:st.K,L:st.L};
  return st;
}
const DEMO_NAMES=['Norbert W.','Olek B.','Igor H.','Grzegorz L.','Szymon','Łukasz D.','Rafał T.','Kamil O.','Piotr Z.','Ewa W.','Kasia L.','Jan K.','Artur G.','Wiktor M.','Bartosz F.','Damian P.','Paweł N.','Robert J.','Ola R.','Hubert S.','Marek Ż.','Konrad E.','Zosia','Patryk B.','Tomek R.','Mateusz C.'];
async function api(path,body){
  if(DEMO) return TTEngine.request(path,body);
  const opt={method:body?'POST':'GET',headers:{'Content-Type':'application/json'}};
  if(ADMIN) opt.headers['X-Admin']=ADMIN;
  if(body) opt.body=JSON.stringify(body);
  const r=await fetch(path,opt); const j=await r.json().catch(()=>({error:'Serwer nie odpowiada. Spróbuj za chwilę.'}));
  if(!r.ok) throw new Error(j.error||'Coś poszło nie tak.');
  return j;
}
async function refresh(force){
  try{
    let s;
    try{ s=await api('api/state'); }
    catch(e){ if(DEMO||S) throw e; DEMO=true; await demoBoot(); s=await api('api/state'); }
    $('#live').classList.remove('off');
    if(force || s.rev!==lastRev){ if(dlgOpen && !force){S=s;return;} S=s; lastRev=s.rev; render(); }
  }catch(e){$('#live').classList.add('off');}
}
setInterval(()=>{ const a=document.activeElement; const typing=a&&(a.tagName==='INPUT'||a.tagName==='SELECT'); if(!document.hidden && !busy && !typing) refresh(false); },4000);

const name=id=>{const p=S.players.find(p=>p.id===id);return p?p.name:'?'};

const valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&Math.max(a,b)===T()&&Math.min(a,b)<T();
const winnerOf=m=>{ if(m.a&&m.b&&valid(m.sa,m.sb)) return m.sa>m.sb?m.a:m.b; return null;};
const isMe=id=>!!id&&mine.some(x=>x.id===id);
const youLbl=()=>mine.length===1?tr(' · ty',' · you'):'';

const PH=['signup','r1','r2','qual','ll','ko','done'];
function steps(){
  const labels=[['signup',tr('Zapisy','Sign-ups')],['r1',tr('Runda 1','Round 1')],['r2',tr('Runda 2','Round 2')],['ll','Lucky Losers'],['ko',tr('Drabinka','Bracket')],['done','Podium']];
  const cur=PH.indexOf(S.phase);
  $('#steps').innerHTML=labels.map(([k,l])=>{const i=PH.indexOf(k);return `<span class="step ${i===cur?'on':i<cur?'done':''}">${l}</span>`}).join('');
}
function header(){
  $('#edition').textContent=tx(S.edition||'');
  const w=tx((S.title||'').trim()).split(/\s+/), cut=w.length>=3?w.length-2:w.length;
  $('#title').innerHTML=esc(w.slice(0,cut).join(' '))+(cut<w.length?` <em>${esc(w.slice(cut).join(' '))}</em>`:'');
  const n=S.players.length;
  const chips=[`🏓 ${n} ${pn(n,['zawodnik','zawodników','zawodników'],['player','players'])}`,...(T()===1?[tr('Mecz: 1 set do 11 punktów','Match: 1 set to 11 points')]:[tr(`Mecz do ${T()} wygranych setów`,`Match: first to ${T()} sets`),tr('Set do 11 punktów','Set to 11 points')])];
  if(n>=3) chips.push(tr(`Drabinka: ${S.K} ${plural(S.K,'miejsce','miejsca','miejsc')}`,`Bracket: ${S.K} ${S.K===1?'place':'places'}`));
  if(S.phase==='signup'&&S.deadline) chips.push(tr(`Zapisy do ${fmtDate(S.deadline)}`,`Sign-ups until ${fmtDate(S.deadline)}`));
  $('#meta').innerHTML=chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('');
}
function plural(n,one,few,many){if(n===1)return one;const d=n%10,dd=n%100;return (d>=2&&d<=4&&!(dd>=12&&dd<=14))?few:many;}
function fmtDate(iso){try{return new Date(iso).toLocaleString(LOC(),{weekday:'short',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}}

function render(){
  header(); steps();
  const out=[];
  if(S.demo) out.push(demoBar());
  if(S.phase==='done') out.push(podium());
  if(S.phase==='signup') out.push(signup());
  if(['ko','done'].includes(S.phase)) out.push(bracket(), statsSec());
  if(S.phase==='qual') out.push(tableSec());
  if(S.phase==='ll') out.push(llSec());
  if(S.phase==='r2') out.push(qualBox());
  if(S.phase==='r2') out.push(roundSec('r2'));
  if(S.phase==='ll') out.push(roundSec('r2'));
  if(['r1','r2','qual','ll'].includes(S.phase)) out.push(roundSec('r1'));
  if(['r1','r2','ll'].includes(S.phase) && S.ranking.length) out.push(tableSec());
  if(['ko','done'].includes(S.phase)) out.push(`<details class="how"><summary>${tr('Kwalifikacje: rundy 1–2 i Lucky Losers','Qualifying: rounds 1–2 and Lucky Losers')}</summary>${S.ll&&S.ll.length?llSec(true):''}${roundSec('r1',true)}${S.r2.length?roundSec('r2',true):''}</details>`);
  if(['ko','done'].includes(S.phase)) out.push(tableSec());
  out.push(allResults());
  if(!['ko','done'].includes(S.phase)) out.push(statsSec());
  out.push(howto());
  $('#admopen').hidden=!S.admin;
  $('#infobtn').hidden=S.phase==='signup';

  $('#app').innerHTML=out.join('');
  bind();
}

  <li>${tr('<b>Awans.</b> Ranking: liczba zwycięstw, potem bilans punktów, potem zdobyte punkty. Czołówka wchodzi do drabinki bezpośrednio.','<b>Qualification.</b> Ranking: number of wins, then point difference, then points scored. The top players go straight into the bracket.')}</li>

function signup(){
  const n=S.players.length; const own=S.players.filter(p=>isMe(p.id)).length;
  const list=S.players.map((p,i)=>`<li class="${isMe(p.id)?'me':''}"><span class="n">${i+1}</span>${esc(p.name)}

  const draw=tr('Losowanie par ruszy, gdy organizator zamknie zapisy'+(S.deadline?` albo automatycznie ${esc(fmtDate(S.deadline))}`:'')+'.','Pairs are drawn when the organizer closes sign-ups'+(S.deadline?` or automatically on ${esc(fmtDate(S.deadline))}`:'')+'.');
  return `<section><div class="sechead"><div><h2>${tr('Dopisz się do turnieju','Join the tournament')}</h2>
    <p class="sub">${tr('Możesz dopisać siebie i inne osoby, każdą osobno. Jeśli są dwie osoby o tym samym imieniu, dodaj inicjał nazwiska.','You can add yourself and other people, one at a time. If two people share a first name, add a surname initial.')} ${draw}</p>
    ${own?`<p class="sub">${tr(`Z tego telefonu dopisano: <b>${own}</b>. Te osoby możesz wypisać krzyżykiem.`,`Added from this device: <b>${own}</b>. You can remove them with the ✕.`)}</p>`:''}</div>
    <div class="big mono" aria-label="${tr('Liczba zapisanych','Number of sign-ups')}">${n}</div></div>

}

function matchBtn(m,stage,opts={}){

  let extra='';
  if(m.half) extra=`<span class="note">${tr(`Mecz uzupełniający: liczy się tylko dla ${esc(name(m.a))} (nieparzysta liczba graczy).`,`Extra match: counts only for ${esc(name(m.a))} (odd number of players).`)}</span>`;
  else if(!done&&canEdit) extra=`<span class="cta">${tr('Wpisz wynik','Enter result')}</span>`;
  else if(!done&&ready&&mine) extra=`<span class="note">${tr('Twój mecz. Po grze podaj wynik organizatorowi.','Your match. Tell the organizer the result after playing.')}</span>`;

  const setsTag=done&&Array.isArray(m.sets)?`<span class="setsnote">${m.sets.map(x=>x[0]+':'+x[1]).join(' · ')}</span>`:'';

}

function qualBox(){
  const R=S.ranking, K=S.K; if(!R.length) return '';
  const rem={}; R.forEach(r=>rem[r.id]=0);
  for(const m of [...S.r1,...S.r2]){ if(!m.a||!m.b||valid(m.sa,m.sb)) continue; rem[m.a]=(rem[m.a]||0)+1; if(!m.half) rem[m.b]=(rem[m.b]||0)+1; }
  const maxW=r=>r.w+(rem[r.id]||0);
  const D=S.D??K, LL=S.L??0;
  const sure=D?R.filter(x=>R.filter(o=>o.id!==x.id&&maxW(o)>=x.w).length<D && x.w>0):[];
  const sureIds=new Set(sure.map(x=>x.id));
  const maybe=R.slice(0,D).filter(x=>!sureIds.has(x.id));
  const li=xs=>xs.map(x=>`<li>${esc(x.name)}${isMe(x.id)?youLbl():''}</li>`).join('');
  const places=n=>pn(n,['miejsce','miejsca','miejsc'],['place','places']);
  const intro=tr(`${D} ${plural(D,'osoba wchodzi','osoby wchodzą','osób wchodzi')} bezpośrednio po rundzie 2.${LL?` Kolejne ${2*LL} ${plural(2*LL,'osoba gra','osoby grają','osób gra')} w Lucky Losers o ${LL} ${plural(LL,'miejsce','miejsca','miejsc')}.`:''} Lista aktualizuje się po każdym wyniku.`,
    `${D} ${D===1?'player goes':'players go'} straight in after round 2.${LL?` The next ${2*LL} ${2*LL===1?'player plays':'players play'} Lucky Losers for ${LL} ${LL===1?'place':'places'}.`:''} The list updates after every result.`);
  return `<section class="qbox"><div><h2>${tr('Drabinka','Bracket')}: ${K} ${places(K)}</h2>
    <p class="sub" style="margin-top:4px">${intro}</p></div>
    <div><div class="qlbl ok">${tr(`✓ Pewny bezpośredni awans: zostańcie, gracie w drabince (${sure.length})`,`✓ Direct qualification secured: stay, you are in the bracket (${sure.length})`)}</div>
    ${sure.length?`<ul class="qlist" style="margin-top:8px">${li(sure)}</ul>`:`<p class="sub" style="margin:6px 0 0">${tr('Jeszcze nikt nie ma pewnego awansu.','Nobody has secured a place yet.')}</p>`}</div>
    ${maybe.length?`<div><div class="qlbl">${tr(`Teraz na miejscach bezpośredniego awansu, jeszcze się waży (${maybe.length})`,`Currently in the direct qualification spots, still undecided (${maybe.length})`)}</div><ul class="qlist maybe" style="margin-top:8px">${li(maybe)}</ul></div>`:''}
  </section>`;
}

function llSec(compact){

function matchMs(m){ if(!(m&&m.t0&&m.t1)) return null; const d=Date.parse(m.t1)-Date.parse(m.t0); return d>0?d:null; }
function fmtDur(ms){ const min=Math.round(ms/60000); if(min<1) return '<1 min'; if(min<60) return min+' min'; return Math.floor(min/60)+' h '+String(min%60).padStart(2,'0')+' min'; }
function fmtClock(iso){ try{ return new Date(iso).toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }

function statsSec(){
  const all=[];
  const add=(ms,l)=>(ms||[]).forEach(m=>{ if(m.a&&m.b&&valid(m.sa,m.sb)) all.push([l,m]); });
  add(S.r1,stg('r1')); add(S.r2,stg('r2')); add(S.ll,stg('ll'));
  if(S.ko){ S.ko.rounds.forEach(r=>add(r,roundName(r.length,true))); if(S.ko.third) add([S.ko.third],stg('third')); }
  const multi=T()>1;
  // jednostki punktowe: cały mecz (do 1 seta) albo każdy set osobno (mecze do kilku setów)
  const seq=[];
  all.forEach(([l,m])=>{
    if(!multi){ if(m.pa!=null) seq.push([l,m]); }
    else if(Array.isArray(m.sets)) m.sets.forEach((st,i)=>seq.push([`${l} · ${tr('set','set')} ${i+1}`,{a:m.a,b:m.b,half:m.half,pa:st[0],pb:st[1]}]));
  });
  const timed=all.map(([l,m])=>[l,m,matchMs(m)]).filter(x=>x[2]!=null);
  const card=(k,v,w,d,hot)=>`<div class="stat ${hot?'hot':''}"><div class="k">${k}</div><div class="v">${v}</div>${w?`<div class="w">${w}</div>`:''}${d?`<div class="d">${d}</div>`:''}</div>`;
  const pts=n=>pn(n,['punkt','punkty','punktów'],['point','points']);
  const unitN=n=>multi?pn(n,['set','sety','setów'],['set','sets']):pn(n,['mecz','mecze','meczów'],['match','matches']);
  const scoreStr=m=>Array.isArray(m.sets)?m.sets.map(x=>x[0]+':'+x[1]).join(', '):(!multi&&m.pa!=null?Math.max(m.pa,m.pb)+':'+Math.min(m.pa,m.pb):`${Math.max(m.sa,m.sb)}:${Math.min(m.sa,m.sb)}`);
  const cards=[];
  // ----- poziom meczu (działa zawsze, także gdy wpisywano tylko wyniki w setach) -----
  const M={}; const mp=id=>M[id]||(M[id]={id,w:0,n:0,run:0,best:0,sw:0,sl:0,cb:0});
  let full=0, comebacks=0;
  all.forEach(([,m])=>{
    const w=winnerOf(m);
    const sides=m.half?[['a','b']]:[['a','b'],['b','a']];
    sides.forEach(([me,op])=>{ const x=mp(m[me]); x.n++; x.sw+=me==='a'?m.sa:m.sb; x.sl+=me==='a'?m.sb:m.sa; if(m[me]===w){x.w++;x.run++;x.best=Math.max(x.best,x.run);} else x.run=0; });
    if(multi&&Math.min(m.sa,m.sb)===T()-1) full++;
    if(multi&&Array.isArray(m.sets)&&m.sets.length>1){ const fw=m.sets[0][0]>m.sets[0][1]?m.a:m.b; if(fw!==w){ comebacks++; mp(w).cb++; } }
  });
  const mps=Object.values(M);
  const topM=(f,min=1)=>mps.filter(x=>x.n>=min).sort((a,b)=>f(b)-f(a)||b.w-a.w)[0];
  const mostW=topM(x=>x.w), streak=topM(x=>x.best), setBal=multi?topM(x=>x.sw-x.sl):null, cbKing=multi&&comebacks?topM(x=>x.cb):null;
  const R=S.ranking||[], idx={}; R.forEach((r,i)=>idx[r.id]=i);
  let up=null; all.forEach(([l,m])=>{ const w=winnerOf(m), lo=w===m.a?m.b:m.a; if(idx[w]==null||idx[lo]==null) return; const gap=idx[w]-idx[lo]; if(gap>0&&(!up||gap>up.gap)) up={gap,w,lo,l,m}; });
  const pointsTotal=seq.reduce((s,[,m])=>s+m.pa+m.pb,0);
  if(all.length>=3){
    cards.push(card(tr('Rozegrane mecze','Matches played'),all.length,'',seq.length?tr(`${pointsTotal} ${pts(pointsTotal)} w ${seq.length} ${unitN(seq.length)}, średnio ${(pointsTotal/seq.length).toFixed(1)} na ${multi?'set':'mecz'}`,`${pointsTotal} ${pts(pointsTotal)} in ${seq.length} ${unitN(seq.length)}, ${(pointsTotal/seq.length).toFixed(1)} per ${multi?'set':'match'} on average`):(multi?tr(`${all.reduce((s,[,m])=>s+m.sa+m.sb,0)} rozegranych setów`,`${all.reduce((s,[,m])=>s+m.sa+m.sb,0)} sets played`):'')));
    cards.push(card(tr('Najwięcej zwycięstw','Most wins'),mostW.w,esc(name(mostW.id)),tr(`na ${mostW.n} ${plural(mostW.n,'mecz','mecze','meczów')}`,`from ${mostW.n} ${mostW.n===1?'match':'matches'}`),true));
    cards.push(card(tr('Najdłuższa seria zwycięstw','Longest winning streak'),streak.best,esc(name(streak.id)),tr('meczów z rzędu','matches in a row')));
    if(multi){
      cards.push(card(tr('Najlepszy bilans setów','Best set difference'),(setBal.sw-setBal.sl>0?'+':'')+(setBal.sw-setBal.sl),esc(name(setBal.id)),`${setBal.sw}:${setBal.sl} ${tr('w setach','in sets')}`,true));
      cards.push(card(tr('Mecze na pełnym dystansie','Matches going the distance'),full,'',tr(`rozstrzygnięte dopiero w ostatnim, decydującym secie (${Math.round(100*full/all.length)}% meczów)`,`decided only in the final set (${Math.round(100*full/all.length)}% of matches)`)));
      if(cbKing&&cbKing.cb) cards.push(card(tr('Król powrotów','Comeback king'),cbKing.cb,esc(name(cbKing.id)),tr(`${cbKing.cb===1?'mecz wygrany':'meczów wygranych'} mimo przegranego 1. seta (łącznie ${comebacks} w turnieju)`,`${cbKing.cb===1?'match':'matches'} won after losing the 1st set (${comebacks} in the whole tournament)`)));
    }
    if(up&&up.gap>=3) cards.push(card(tr('Największa niespodzianka','Biggest upset'),tr(`${up.gap} ${plural(up.gap,'miejsce','miejsca','miejsc')}`,`${up.gap} ${up.gap===1?'place':'places'}`),tr(`${esc(name(up.w))} pokonuje ${esc(name(up.lo))}`,`${esc(name(up.w))} beats ${esc(name(up.lo))}`),tr(`#${idx[up.w]+1} wygrywa z #${idx[up.lo]+1} · ${scoreStr(up.m)} · ${up.l}`,`#${idx[up.w]+1} beats #${idx[up.lo]+1} · ${scoreStr(up.m)} · ${up.l}`),true));
  }
  // ----- poziom punktów (gdy wpisywano punkty) -----
  if(seq.length>=3){
    const diff=m=>Math.abs(m.pa-m.pb), sum=m=>m.pa+m.pb, wp=m=>m.pa>m.pb?m.a:m.b;
    const txt=([l,m])=>{const w=wp(m),lo=w===m.a?m.b:m.a,hi=Math.max(m.pa,m.pb),lw=Math.min(m.pa,m.pb);return {w:`${esc(name(w))} – ${esc(name(lo))}`,d:`${hi}:${lw} · ${l}`};};
    const pick=(f,cmp)=>seq.reduce((b,x)=>b===null||cmp(f(x[1]),f(b[1]),x,b)?x:b,null);
    const blow=pick(diff,(a,b)=>a>b), close=pick(m=>m.pa+m.pb,(a,b,x,y)=>diff(x[1])<diff(y[1])||(diff(x[1])===diff(y[1])&&a>b)), longest=pick(sum,(a,b)=>a>b);
    const deuce=seq.filter(([,m])=>Math.max(m.pa,m.pb)>11).length, zeros=seq.filter(([,m])=>Math.min(m.pa,m.pb)===0).length, tight=seq.filter(([,m])=>diff(m)===2).length;
    const dT=timed.filter(x=>!multi&&x[1].pa!=null&&Math.max(x[1].pa,x[1].pb)>11), nT=timed.filter(x=>!multi&&x[1].pa!=null&&Math.max(x[1].pa,x[1].pb)<=11);
    const avgOf=a=>a.reduce((s,x)=>s+x[2],0)/a.length;
    const deuceNote=dT.length&&nT.length?tr(` Średnio ${fmtDur(avgOf(dT))} wobec ${fmtDur(avgOf(nT))} w pozostałych.`,` Average ${fmtDur(avgOf(dT))} vs ${fmtDur(avgOf(nT))} in the others.`):'';
    const P={}; const pl=id=>P[id]||(P[id]={id,pf:0,pa:0,k:0});
    seq.forEach(([,m])=>{ const sides=m.half?[['a','b']]:[['a','b'],['b','a']];
      sides.forEach(([me])=>{const x=pl(m[me]); x.pf+=me==='a'?m.pa:m.pb; x.pa+=me==='a'?m.pb:m.pa; x.k++;}); });
    const ps=Object.values(P);
    const top=(f,min=1)=>ps.filter(x=>x.k>=min).sort((a,b)=>f(b)-f(a))[0];
    const mostPts=top(x=>x.pf), bestBal=top(x=>x.pf-x.pa), wall=top(x=>-x.pa/x.k,2);
    const b=txt(blow), c=txt(close), lg=txt(longest);
    cards.push(card(multi?tr('Najwyższy set','Biggest set win'):tr('Najwyższe zwycięstwo','Biggest win'),b.d.split(' · ')[0],b.w,b.d.split(' · ').slice(1).join(' · '),true));
    cards.push(card(multi?tr('Najbardziej zacięty set','Closest set'):tr('Najbardziej zacięty mecz','Closest match'),c.d.split(' · ')[0],c.w,c.d.split(' · ').slice(1).join(' · ')));
    cards.push(card(multi?tr('Najdłuższy set (punkty)','Longest set (points)'):tr('Najdłuższy mecz (punkty)','Longest match (points)'),lg.d.split(' · ')[0],lg.w,`${sum(longest[1])} ${pts(sum(longest[1]))} · ${lg.d.split(' · ').slice(1).join(' · ')}`));
    cards.push(card(tr('Najwięcej zdobytych punktów','Most points scored'),mostPts.pf,esc(name(mostPts.id)),tr(`w ${mostPts.k} ${multi?plural(mostPts.k,'secie','setach','setach'):plural(mostPts.k,'meczu','meczach','meczach')}`,`in ${mostPts.k} ${unitN(mostPts.k)}`)));
    cards.push(card(tr('Najlepszy bilans punktów','Best point difference'),(bestBal.pf-bestBal.pa>0?'+':'')+(bestBal.pf-bestBal.pa),esc(name(bestBal.id)),`${bestBal.pf}:${bestBal.pa}`));
    if(wall) cards.push(card(tr('Najszczelniejsza obrona','Tightest defence'),(wall.pa/wall.k).toFixed(1),esc(name(wall.id)),tr(`traconych punktów na ${multi?'set':'mecz'}`,`points conceded per ${multi?'set':'match'}`)));
    cards.push(card(tr('Gra na przewagi','Deuce games'),deuce,'',tr(`${multi?plural(deuce,'set skończył','sety skończyły','setów skończyło'):plural(deuce,'mecz skończył','mecze skończyły','meczów skończyło')} się po 10:10.`,`${unitN(deuce)} went past 10:10.`)+deuceNote));
    if(tight) cards.push(card(multi?tr('Sety na styku','Tight sets'):tr('Mecze na styku','Tight finishes'),tight,'',tr(`wygrane różnicą dokładnie 2 punktów (${Math.round(100*tight/seq.length)}% ${multi?'setów':'meczów'})`,`won by exactly 2 points (${Math.round(100*tight/seq.length)}% of ${unitN(2)})`)));
    if(zeros) cards.push(card(tr('Do zera','Shutouts'),zeros,'',tr(`${multi?plural(zeros,'set','sety','setów'):plural(zeros,'mecz','mecze','meczów')} 11:0`,`${unitN(zeros)} won 11:0`)));
  }
  if(timed.length){
    const tot=timed.reduce((s,x)=>s+x[2],0);
    const lg=timed.reduce((b,x)=>x[2]>b[2]?x:b), sh=timed.reduce((b,x)=>x[2]<b[2]?x:b);
    const nm=([,m])=>{ const w=winnerOf(m); return `${esc(name(w))} – ${esc(name(w===m.a?m.b:m.a))}`; };
    const sc=([l,m])=>`${scoreStr(m)} · ${l}`;
    cards.push(card(tr('Średni czas meczu','Average match time'),fmtDur(tot/timed.length),'',tr(`z ${timed.length} ${plural(timed.length,'zmierzonego meczu','zmierzonych meczów','zmierzonych meczów')}`,`from ${timed.length} timed ${timed.length===1?'match':'matches'}`),true));
    cards.push(card(tr('Najdłuższy mecz (czas)','Longest match (time)'),fmtDur(lg[2]),nm(lg),sc(lg)));
    if(timed.length>1) cards.push(card(tr('Najkrótszy mecz (czas)','Shortest match (time)'),fmtDur(sh[2]),nm(sh),sc(sh)));
    cards.push(card(tr('Łącznie przy stole','Total time at the table'),fmtDur(tot),'',tr('suma czasu zmierzonych meczów','sum of the timed matches')));
  }
  if(!cards.length) return '';
  return `<details class="how statsbox" data-stats ${statsOpen?'open':''}><summary>${tr('Statystyki turnieju','Tournament stats')}</summary><p class="sub" style="margin:0 0 12px">${tr('Liczone ze wszystkich rozegranych meczów, łącznie z Lucky Losers i drabinką.','Calculated from all matches played, including Lucky Losers and the bracket.')}${multi&&seq.length?tr(' Mecze do kilku setów: statystyki punktowe liczone z każdego seta osobno.',' Multi-set matches: point stats are calculated from every set separately.'):''}${timed.length?tr(' Czas meczu mierzymy od kliknięcia „Start meczu” do wpisania wyniku.',' Match time runs from tapping “Start match” to entering the result.'):''}</p><div class="stats">${cards.join('')}</div></details>`;
}

function allResults(){
  const rows=[];
  const add=(ms,label)=>(ms||[]).forEach(m=>{ if(m.a&&m.b&&valid(m.sa,m.sb)) rows.push([label,m]); });
  add(S.r1,stg('r1')); add(S.r2,stg('r2')); add(S.ll,stg('ll'));
  if(S.ko){ S.ko.rounds.forEach(r=>add(r,roundName(r.length,true))); if(S.ko.third) add([S.ko.third],stg('third')); }
  const sc=(m,side)=>T()===1&&m.pa!=null?(side==='a'?m.pa:m.pb):(side==='a'?m.sa:m.sb);
  const body=rows.length?rows.map(([l,m])=>{const w=winnerOf(m);return `<tr><td>${l}${m.half?` <span class="n" title="${tr('Mecz uzupełniający','Extra match')}">*</span>`:''}</td>
    <td style="${w===m.a?'font-weight:800':''}">${esc(name(m.a))}</td><td class="num">${sc(m,'a')} : ${sc(m,'b')}${Array.isArray(m.sets)?`<div class="setpts">${m.sets.map(x=>x[0]+':'+x[1]).join(' · ')}</div>`:''}</td><td style="${w===m.b?'font-weight:800':''}">${esc(name(m.b))}</td></tr>`}).join('')

  return `<section><div class="sechead"><div><h2>${tr('Wszystkie wyniki','All results')}</h2><p class="sub">${tr('Każdy rozegrany mecz turnieju, od rundy 1.','Every match played in the tournament, from round 1.')}${rows.some(([,m])=>m.half)?tr(' Gwiazdka: mecz uzupełniający, liczony tylko dla pierwszego gracza.',' Asterisk: extra match, counted only for the first player.'):''}</p></div><span class="chip mono">${rows.length} ${pn(rows.length,['mecz','mecze','meczów'],['match','matches'])}</span></div>
    <div class="tablewrap"><table><thead><tr><th>${tr('Etap','Stage')}</th><th>${tr('Gracz','Player')}</th><th class="num">${tr('Wynik','Result')}</th><th>${tr('Gracz','Player')}</th></tr></thead><tbody>${body}</tbody></table></div></section>`;

function roundSec(stage,compact){
  const ms=S[stage]; if(!ms||!ms.length) return '';
  const done=ms.filter(m=>valid(m.sa,m.sb)).length;
  const head=`<div class="sechead"><div><h2>${stg(stage)}</h2><p class="sub">${stage==='r1'?tr('Wszyscy grają po jednym meczu, pary z losowania.','Everyone plays one match, pairs drawn at random.'):tr('Wygrani z rundy 1 grają z wygranymi, przegrani z przegranymi. Po tej rundzie każdy ma dwa mecze.','Round 1 winners play winners, losers play losers. After this round everyone has played two matches.')}</p></div><span class="chip mono">${done}/${ms.length} ${tr('meczów','matches')}</span></div>`;
  let body;
  if(stage==='r2'){
    const pools=[['win',tr('Wygrani z rundy 1','Round 1 winners'),''],['lose',tr('Przegrani z rundy 1','Round 1 losers'),'']].map(([k,l,c])=>{const xs=ms.filter(m=>m.pool===k); if(!xs.length) return '';
      return `<div><div class="poolhead"><span class="tag ${c}">${k==='win'?'1–0':'0–1'}</span>${l}</div><div class="mlist">${xs.map(m=>matchBtn(m,stage)).join('')}</div></div>`}).join('');
    body=`<div class="pools">${pools}</div>`;
  } else body=`<div class="pools"><div class="mlist">${ms.slice(0,Math.ceil(ms.length/2)).map(m=>matchBtn(m,stage)).join('')}</div><div class="mlist">${ms.slice(Math.ceil(ms.length/2)).map(m=>matchBtn(m,stage)).join('')}</div></div>`;
  return compact?`<div style="margin-block:12px 20px">${head}${body}</div>`:`<section>${head}${body}</section>`;
}

function tableSec(){
  const R=S.ranking||[]; if(!R.length) return '';
  const qual=S.phase==='qual', post=['ko','done'].includes(S.phase), pre=!qual&&!post;
  const view=tblView||(S.phase==='ko'?'rank':'final');
  const rankView=post&&view==='rank', zones=pre||rankView;
  const showStage=post&&!rankView, showStatus=pre||rankView;
  const K=S.K, tie=new Set(S.tie||[]), sel=new Set(S.sel||[]);
  const D=S.D??K, LL=S.L??0;
  const idx={}; R.forEach((r,i)=>idx[r.id]=i);
  const info={}; R.forEach(r=>info[r.id]={lvl:0,lbl:['r1','r2'].includes(S.phase)?tr('Kwalifikacje','Qualifying'):stg('r2')});
  const llDone=(S.ll||[]).filter(m=>valid(m.sa,m.sb));
  (S.ll||[]).forEach(m=>{[m.a,m.b].forEach(id=>{if(info[id]){info[id].lvl=5;info[id].lbl='Lucky Losers';}});});
  (S.llDirect||[]).forEach(id=>{if(info[id]){info[id].lvl=6;info[id].lbl=tr('Awans bezpośredni','Direct qualification');}});
  llDone.forEach(m=>{const w=winnerOf(m); if(info[w]){info[w].lvl=6;info[w].lbl=tr('Awans z Lucky Losers','Qualified via Lucky Losers');}});
  if(S.ko){
    const RR=S.ko.rounds, last=RR.length-1;
    RR.forEach((r,ri)=>r.forEach(m=>[m.a,m.b].forEach(id=>{ if(id&&info[id]){ info[id].lvl=10+ri; info[id].lbl=roundName(r.length,true); } })));
    const f=RR[last][0], fw=winnerOf(f);
    if(fw){ info[fw].lvl=10+last+1; info[fw].lbl=tr('Zwycięzca','Winner'); const fl=fw===f.a?f.b:f.a; info[fl].lbl=tr('Finał (2. miejsce)','Final (2nd place)'); }
    const th=S.ko.third, tw=th&&winnerOf(th);
    if(tw){ const tl=tw===th.a?th.b:th.a; info[tw].lvl+=0.3; info[tw].lbl=tr('3. miejsce','3rd place'); info[tl].lvl+=0.1; info[tl].lbl=tr('4. miejsce','4th place'); }
  }
  const koSt={};
  if(S.ko){
    const RR=S.ko.rounds;
    RR.forEach(r=>r.forEach(m=>{ [m.a,m.b].forEach(id=>{ if(id&&!koSt[id]) koSt[id]='in'; }); const w=winnerOf(m); if(w){ const lo=w===m.a?m.b:m.a; if(lo) koSt[lo]='out'; } }));
    const th=S.ko.third; if(th){ [th.a,th.b].forEach(id=>{ if(id) koSt[id]='third'; }); if(winnerOf(th)){ koSt[th.a]='out'; koSt[th.b]='out'; } }
    const fw=winnerOf(RR[RR.length-1][0]); if(fw) koSt[fw]='champ';
  }
  const llM=id=>(S.ll||[]).find(x=>x.a===id||x.b===id);
  const status=(id,i)=>{
    if(post){ const k=koSt[id]; return k==='champ'?['in',tr('Mistrz','Champion')]:k==='in'?['in',tr('W grze','Still in')]:k==='third'?['ll',tr('Gra o 3. miejsce','Playing for 3rd place')]:k==='out'?['out',tr('Odpadł(a) w drabince','Out in the bracket')]:llM(id)?['out',tr('Odpadł(a) w Lucky Losers','Out in Lucky Losers')]:['out',tr('Odpadł(a) w kwalifikacjach','Out in qualifying')]; }
    if(S.phase==='ll'){
      if(info[id].lvl===6) return ['in',tr('W drabince','In the bracket')];
      const m=llM(id); if(m){ if(valid(m.sa,m.sb)) return ['out',tr('Odpadł(a) w Lucky Losers','Out in Lucky Losers')]; return ['ll',tr('Gra w Lucky Losers','Playing Lucky Losers')]; }
      return ['out',tr('Poza drabinką','Out of the bracket')];
    }
    return i<D?['in',tr('Awans bezpośredni','Direct qualification')]:i<D+2*LL?['ll','Lucky Losers']:['out',tr('Poza drabinką','Out of the bracket')];
  };
  const rows=post&&!rankView?[...R].sort((a,b)=>info[b.id].lvl-info[a.id].lvl||idx[a.id]-idx[b.id]):R;
  const body=rows.map((r,i)=>{
    const inK=qual?sel.has(r.id):zones&&i<D;
    const st=(showStatus?status(r.id,i):null);
    const cls=[st&&st[0]==='out'?'out':'', zones&&(i===D-1||(LL&&i===D+2*LL-1))?'cut':'', inK?'in':'', zones&&i>=D&&i<D+2*LL?'llz':'', tie.has(r.id)?'tie':'', isMe(r.id)?'me':''].join(' ');
    const diff=T()===1?r.pw-r.pl:r.sw-r.sl;
    return `<tr class="${cls}"><td class="num">${i+1}</td><td>${esc(r.name)}${isMe(r.id)?youLbl():''}</td>${showStage?`<td>${info[r.id].lbl}</td>`:''}${showStatus?`<td><span class="stt st-${st[0]}">${st[1]}</span></td>`:''}<td class="num">${r.played}</td><td class="num">${r.w}</td><td class="num">${T()===1?`${r.pw}:${r.pl}`:`${r.sw}:${r.sl}`}</td><td class="num">${diff>0?'+':''}${diff}</td>${qual&&S.admin?`<td><input type="checkbox" aria-label="${tr('Awans','Qualifies')}: ${esc(r.name)}" data-sel="${r.id}" ${sel.has(r.id)?'checked':''}></td>`:qual?`<td>${sel.has(r.id)?'✓':''}</td>`:''}</tr>`;}).join('');
  const order=T()===1?tr('zwycięstwa, bilans punktów, zdobyte punkty','wins, point difference, points scored'):tr('zwycięstwa, bilans setów, bilans punktów','wins, set difference, point difference');
  const sub=qual?tr(`Na granicy awansu jest remis (podświetlone wiersze). Organizator wybiera ${K} osób do drabinki.`,`There is a tie at the cut-off (highlighted rows). The organizer picks ${K} players for the bracket.`)
    :post&&!rankView?tr(`Miejsca według etapu, do którego ktoś doszedł, a w obrębie etapu według rankingu z rund 1–2 (${order}). Mecze, zwycięstwa i punkty liczone z rund 1–2.`,`Places by the stage each player reached; within a stage, by the rounds 1–2 ranking (${order}). Matches, wins and points are counted from rounds 1–2.`)
    :tr(`${LL?`Miejsca 1–${D}: bezpośrednio do drabinki. Miejsca ${D+1}–${D+2*LL}: Lucky Losers, zwycięzcy ${LL} meczów dołączają do drabinki.${R.length>D+2*LL?' Pozostali kończą udział.':''}`:`Do drabinki wchodzi ${K} najlepszych.`} Kolejność: ${order}.`,
        `${LL?`Places 1–${D}: straight into the bracket. Places ${D+1}–${D+2*LL}: Lucky Losers, the winners of ${LL} ${LL===1?'match':'matches'} join the bracket.${R.length>D+2*LL?' Everyone else is out.':''}`:`The top ${K} go into the bracket.`} Order: ${order}.`)+(zones?tr(` Poniżej ostatniej linii odpadają przy obecnym układzie; kolumna Status pokazuje, kto jeszcze gra.`,` Anyone below the last line is out at the current standings; the Status column shows who is still in.`):'');
  const seg=post?`<div class="seg" role="group" aria-label="${tr('Widok tabeli','Table view')}"><button type="button" data-tview="final" aria-pressed="${!rankView}">${tr('Miejsca końcowe','Final standings')}</button><button type="button" data-tview="rank" aria-pressed="${rankView}">${tr('Progi awansu','Qualification cut-offs')}</button></div>`:'';
  const head=`<div class="sechead"><div><h2>${qual?tr('Tabela: awans do drabinki','Standings: bracket qualification'):tr('Tabela','Standings')}</h2><p class="sub">${sub}</p></div>${seg}</div>`;
  return `<section>${head}<div class="tablewrap"><table><thead><tr><th class="num">#</th><th>${tr('Zawodnik','Player')}</th>${showStage?`<th>${tr('Etap','Stage')}</th>`:''}${showStatus?`<th>${tr('Status','Status')}</th>`:''}<th class="num">${tr('M','P')}</th><th class="num">${tr('Z','W')}</th><th class="num">${T()===1?tr('Punkty','Points'):tr('Sety','Sets')}</th><th class="num">+/−</th>${qual?`<th>${tr('Awans','Qualifies')}</th>`:''}</tr></thead><tbody>${body}</tbody></table></div>
    ${zones?`<div class="cutlabel">${tr('Przerywane linie: granica bezpośredniego awansu','Dashed lines: direct qualification cut-off')}${LL?tr(' i Lucky Losers',' and Lucky Losers'):''}</div>`:''}
    ${qual&&S.admin?`<div class="actions" style="margin-top:12px"><span class="chip mono">${sel.size}/${K} ${tr('wybranych','selected')}</span><button class="btn" data-admin="startko" ${sel.size!==K?'disabled':''}>${tr('Uruchom drabinkę','Start the bracket')}</button></div>`:''}
    ${qual&&!S.admin?`<p class="notice warn" style="margin-top:12px">${tr('Czekamy na decyzję organizatora. Drabinka pojawi się tu automatycznie.','Waiting for the organizer’s decision. The bracket will appear here automatically.')}</p>`:''}</section>`;
}

function roundName(n,sing){ if(LANG==='pl') return n===1?'Finał':n===2?(sing?'Półfinał':'Półfinały'):n===4?(sing?'Ćwierćfinał':'Ćwierćfinały'):`1/${n} finału`; return n===1?'Final':n===2?(sing?'Semi-final':'Semi-finals'):n===4?(sing?'Quarter-final':'Quarter-finals'):`Round of ${2*n}`; }

function laurel(color){
  let out='', stems='';
  const R=68, C=100, N=10;
  for(const side of [-1,1]){
    const a0=side<0?112:68, a1=side<0?248:-68;
    let d='';
    for(let i=0;i<=N;i++){
      const t=i/N, th=(a0+(a1-a0)*t)*Math.PI/180;
      const x=C+R*Math.cos(th), y=C+R*Math.sin(th);
      d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
      if(i===0) continue;
      const sz=1-t*0.4, deg=th*180/Math.PI;
      for(const k of [-1,1]){
        const off=k*9*sz, lx=C+(R+off)*Math.cos(th), ly=C+(R+off)*Math.sin(th);
        const rot=deg + (side<0?1:-1)*k*-28;
        out+=`<ellipse cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" rx="${(5.2*sz).toFixed(1)}" ry="${(12*sz).toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})" fill="${color}" opacity="${(0.7+0.3*(1-t)).toFixed(2)}"/>`;
      }
    }
    stems+=`<path d="${d}" stroke="${color}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 200 200" aria-hidden="true">${stems}${out}<path d="M88 170 l12 -6 l12 6" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function podium(){

  const place=(cls,num,id,label,color)=>`<div class="place ${cls}"><div class="wreath">${laurel(color)}<span class="num" style="color:${color}">${num}</span></div><div class="pname">${id?esc(name(id)):'—'}</div><div class="plabel">${label}</div><div class="block">${num}</div></div>`;
  return `<section class="podium-sec"><div class="eyebrow" style="margin:0">${tr('Turniej zakończony','Tournament finished')}</div><h2>${tr('Mistrz','Champion')}: ${esc(name(w))}</h2>
  <div class="podium">${place('p2',2,second,tr('Srebro','Silver'),'var(--silver)')}${place('p1',1,w,tr('Złoto','Gold'),'var(--gold)')}${third?place('p3',3,third,tr('Brąz','Bronze'),'var(--bronze)'):'<div></div>'}</div>

}

function toLocalInput(iso){const d=new Date(iso);const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;}

  },{sim:tr('Wyniki wylosowane.','Results drawn at random.'),fresh:tr('Nowy turniej: 26 osób na liście, zamknij zapisy w panelu organizatora.','New tournament: 26 people on the list, close sign-ups in the organizer panel.'),random:'',sample:tr('Wczytano przykładowy turniej.','Sample tournament loaded.')}[b.dataset.demo]));
  const jf=$('#joinf'); if(jf) jf.addEventListener('submit',e=>{e.preventDefault(); const n=$('#jname').value;
    run(async()=>{const s=await api('api/join',{name:n}); mine.push({id:s.me,token:s.token}); LS.set('tt_mine',mine); return s;},tr('Dopisano: ','Added: ')+n.trim()).then(()=>{const i=$('#jname'); if(i) i.focus();});});
  document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=()=>{const e=mine.find(x=>x.id===b.dataset.leave); if(!e) return; run(async()=>{const s=await api('api/leave',e); mine=mine.filter(x=>x.id!==e.id); LS.set('tt_mine',mine); return s;},tr('Wypisano z turnieju.','Removed from the tournament.'));});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>run(()=>api('api/admin',{action:'remove',id:b.dataset.remove}),tr('Usunięto z listy.','Removed from the list.')));
  document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>openScore(...b.dataset.score.split(':')));
  document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>run(()=>api('api/admin',{action:b.dataset.admin}),b.dataset.admin==='draw'?tr('Pary rozlosowane.','Pairs drawn.'):tr('Drabinka uruchomiona.','Bracket started.')));
  document.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{const sel=new Set(S.sel||[]); c.checked?sel.add(c.dataset.sel):sel.delete(c.dataset.sel);
    run(()=>api('api/admin',{action:'select',sel:[...sel]}));});
  document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>confirmBox(b.dataset.confirm));
  document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>renameBox(b.dataset.rename));
  const sf=$('#setf'); if(sf) sf.addEventListener('submit',e=>{e.preventDefault();
    const dlv=$('#s_dl').value; const body={action:'settings',title:$('#s_title').value,edition:$('#s_ed').value,prize:$('#s_prize').value,scoreMode:$('#s_mode').value};
    if(!$('#s_k').disabled) body.koSize=$('#s_k').value||null;
    if(!$('#s_ll').disabled) body.llSpots=$('#s_ll').value||null;
    if(!$('#s_sets').disabled) body.setsToWin=+$('#s_sets').value;
    if(!$('#s_dl').disabled) body.deadline=dlv?new Date(dlv).toISOString():null;
    run(()=>api('api/admin',body),tr('Zapisano ustawienia.','Settings saved.'));});
  const lf=$('#latef'); if(lf) lf.addEventListener('submit',e=>{e.preventDefault(); const n=$('#l_name').value; run(()=>api('api/admin',{action:'late',name:n}),tr('Dopisano do gry: ','Added to the game: ')+n.trim());});
  const af=$('#addf'); if(af) af.addEventListener('submit',e=>{e.preventDefault(); run(()=>api('api/admin',{action:'add',name:$('#a_name').value}),tr('Dodano zawodnika.','Player added.'));});
}

function findMatch(stage,id){ if(stage==='r1'||stage==='r2'||stage==='ll') return (S[stage]||[]).find(m=>m.id===id); if(stage==='ko') return S.ko.rounds.flat().find(m=>m.id===id); return S.ko.third; }
function showDlg(html,onBind){ const f=$('#dlgform'); f.innerHTML=html; const d=$('#dlg'); dlgOpen=true; d.showModal(); onBind&&onBind(f); d.onclose=()=>{dlgOpen=false; refresh(true);}; }

function timingRow(m){
  const done=valid(m.sa,m.sb);
  if(!done&&m.t0) return `<div class="timing"><span>▶ ${tr('Mecz trwa od','Match running since')} <b>${fmtClock(m.t0)}</b> (${fmtDur(Date.now()-Date.parse(m.t0))})</span><button type="button" class="ghost small" id="dunstart">${tr('Cofnij start','Undo start')}</button></div>`;
  if(!done) return `<div class="timing"><span>${tr('Zegar meczu: wpisanie wyniku zakończy pomiar.','Match timer: entering the result stops it.')}</span><button type="button" class="ghost small" id="dstart">${tr('▶ Start meczu','▶ Start match')}</button></div>`;
  const ms=matchMs(m); return ms!=null?`<div class="timing"><span>⏱ ${tr('Czas meczu','Match time')}: <b>${fmtDur(ms)}</b> (${fmtClock(m.t0)}–${fmtClock(m.t1)})</span></div>`:'';
}
function bindTiming(stage,m){
  const go=async(cancel,msg)=>{ try{ const s=await api('api/start',{stage,id:m.id,cancel}); S=s; lastRev=s.rev; $('#dlg').close(); toast(msg); }catch(e){ $('#derr').textContent=te(e.message); } };
  const a=$('#dstart'); if(a) a.onclick=()=>go(false,tr('Start meczu zapisany.','Match start recorded.'));
  const b=$('#dunstart'); if(b) b.onclick=()=>go(true,tr('Start cofnięty.','Start undone.'));
}
function openSets(stage,m){
  const t=T(), max=2*t-1, have=Array.isArray(m.sets)?m.sets:[];
  const inp=(i,k)=>`<input type="number" inputmode="numeric" min="0" max="99" data-set="${i}:${k}" value="${have[i]?have[i][k]:''}" aria-label="${esc(name(k?m.b:m.a))}, ${tr('set','set')} ${i+1}">`;
  const rows=Array.from({length:max},(_,i)=>`<div class="setrow" data-row="${i}" ${i<Math.max(t,have.length)?'':'hidden'}><span class="sn">${tr('Set','Set')} ${i+1}</span>${inp(i,0)}<span class="sep">:</span>${inp(i,1)}</div>`).join('');
  showDlg(`<h3>${tr('Wynik meczu','Match result')}</h3>
    <p class="sub">${tr(`Wpisz punkty każdego seta (do 11, przy 10:10 do dwóch punktów przewagi). Mecz kończy się, gdy ktoś wygra ${t} sety, a wynik w setach policzy się sam.`,`Enter the points of every set (to 11; from 10:10 you need a two-point lead). The match ends when someone wins ${t} sets and the set score is worked out for you.`)}</p>
    <div class="setgrid"><div class="setrow head"><span></span><b>${esc(name(m.a))}</b><span></span><b>${esc(name(m.b))}</b></div>${rows}</div>
    <div class="setsum" id="setsum"></div>
    ${timingRow(m)}<div class="err" id="derr"></div>
    <div class="row">${valid(m.sa,m.sb)?`<button type="button" class="ghost danger" id="dclr">${tr('Wyczyść wynik','Clear result')}</button>`:''}<button type="button" class="ghost" id="dcan">${tr('Anuluj','Cancel')}</button><button type="button" class="btn" id="dok" disabled>${tr('Zapisz wynik','Save result')}</button></div>`,
  f=>{
    bindTiming(stage,m);
    const val=(i,k)=>{ const v=f.querySelector(`[data-set="${i}:${k}"]`).value; return v===''?null:parseInt(v,10); };
    const good=(x,y)=>Number.isInteger(x)&&Number.isInteger(y)&&x>=0&&y>=0&&Math.max(x,y)>=11&&Math.abs(x-y)>=2;
    let list=[];
    const calc=()=>{
      let wa=0,wb=0,decided=false; list=[];
      for(let i=0;i<max;i++){
        const row=f.querySelector(`[data-row="${i}"]`);
        row.hidden=!(i<t||(!decided&&list.length===i));
        if(row.hidden){ row.querySelectorAll('input').forEach(x=>x.value=''); continue; }
        const x=val(i,0), y=val(i,1);
        if(!decided&&list.length===i&&good(x,y)){ list.push([x,y]); if(x>y) wa++; else wb++; if(wa===t||wb===t) decided=true; }
      }
      const sum=$('#setsum');
      sum.textContent=!list.length?'':decided?`${tr('Wynik','Result')}: ${wa} : ${wb} · ${tr('wygrywa','winner:')} ${name(wa>wb?m.a:m.b)}`:`${tr('Stan setów','Sets so far')}: ${wa} : ${wb}`;
      $('#dok').disabled=!decided;
    };
    f.querySelectorAll('[data-set]').forEach(el=>el.addEventListener('input',e=>{
      calc();
      const [i,k]=el.dataset.set.split(':').map(Number);
      if(k===1&&good(val(i,0),val(i,1))){ const nx=f.querySelector(`[data-row="${i+1}"]:not([hidden]) input`); if(nx&&nx.value==='') nx.focus(); }
    }));
    $('#dcan').onclick=()=>$('#dlg').close();
    $('#dok').onclick=async()=>{ try{ const s=await api('api/score',{stage,id:m.id,sets:list}); S=s; lastRev=s.rev; $('#dlg').close(); toast(tr('Wynik zapisany.','Result saved.')); }catch(e){ $('#derr').textContent=te(e.message); } };
    const c=$('#dclr'); if(c) c.onclick=async()=>{ try{ const s=await api('api/score',{stage,id:m.id,sa:null,sb:null}); S=s; lastRev=s.rev; $('#dlg').close(); toast(tr('Wynik usunięty.','Result removed.')); }catch(e){ $('#derr').textContent=te(e.message); } };
    calc();
    setTimeout(()=>{ const first=[...f.querySelectorAll('[data-set]')].find(x=>!x.closest('[hidden]')&&x.value===''); if(first) first.focus(); },50);
  });
}
function openScore(stage,id){
  const m=findMatch(stage,id); if(!m) return; const t=T(); const opts=[];
  if((S.scoreMode||'points')==='points') return t===1?openPoints(stage,m):openSets(stage,m);
  for(let l=0;l<t;l++) opts.push([t,l]); for(let l=t-1;l>=0;l--) opts.push([l,t]);
  let pick=valid(m.sa,m.sb)?[m.sa,m.sb]:null;
  showDlg(`<h3>${tr('Wynik meczu','Match result')}</h3><div class="vs"><span>${esc(name(m.a))}</span><span>vs</span><span>${esc(name(m.b))}</span></div>
    <div class="opts">${opts.map(([a,b])=>`<button type="button" class="opt ${pick&&pick[0]===a&&pick[1]===b?'sel':''}" data-o="${a}-${b}"><b>${a} : ${b}</b><small>${tr('wygrywa','winner:')} ${esc(name(a>b?m.a:m.b))}</small></button>`).join('')}</div>
    ${timingRow(m)}<div class="err" id="derr"></div>
    <div class="row">${valid(m.sa,m.sb)?`<button type="button" class="ghost danger" id="dclr">${tr('Wyczyść wynik','Clear result')}</button>`:''}<button type="button" class="ghost" id="dcan">${tr('Anuluj','Cancel')}</button><button type="button" class="btn" id="dok" ${pick?'':'disabled'}>${tr('Zapisz wynik','Save result')}</button></div>`,
  f=>{
    bindTiming(stage,m);
    f.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{pick=b.dataset.o.split('-').map(Number); f.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); $('#dok').disabled=false;});
    $('#dcan').onclick=()=>$('#dlg').close();
    const send=async(sa,sb)=>{ try{ const s=await api('api/score',{stage,id,sa,sb}); S=s; lastRev=s.rev; $('#dlg').close(); toast(sa===null?tr('Wynik usunięty.','Result removed.'):tr('Wynik zapisany.','Result saved.')); }catch(e){ $('#derr').textContent=te(e.message); } };
    $('#dok').onclick=()=>pick&&send(pick[0],pick[1]);
    const c=$('#dclr'); if(c) c.onclick=()=>send(null,null);
  });
}
function openPoints(stage,m){
  const has=m.pa!=null;
  showDlg(`<h3>${tr('Wynik seta','Set result')}</h3><p class="sub">${tr('Gramy do 11, przy 10:10 do dwóch punktów przewagi.','Played to 11; from 10:10 you need a two-point lead.')}</p>
    <div class="grid2" style="margin-top:14px;grid-template-columns:1fr 1fr">
      <label class="f">${esc(name(m.a))}<input id="pa" type="number" inputmode="numeric" min="0" max="99" value="${has?m.pa:''}" style="font-size:1.6rem;font-family:var(--f-mono);text-align:center"></label>
      <label class="f">${esc(name(m.b))}<input id="pb" type="number" inputmode="numeric" min="0" max="99" value="${has?m.pb:''}" style="font-size:1.6rem;font-family:var(--f-mono);text-align:center"></label>
    </div>
    <div class="actions" style="margin-top:10px"><button type="button" class="ghost small" id="qa">${esc(name(m.a))} 11</button><button type="button" class="ghost small" id="qb">${esc(name(m.b))} 11</button></div>
    ${timingRow(m)}<div class="err" id="derr"></div>
    <div class="row">${has?`<button type="button" class="ghost danger" id="dclr">${tr('Wyczyść wynik','Clear result')}</button>`:''}<button type="button" class="ghost" id="dcan">${tr('Anuluj','Cancel')}</button><button type="button" class="btn" id="dok">${tr('Zapisz wynik','Save result')}</button></div>`,
  f=>{
    bindTiming(stage,m);
    $('#dcan').onclick=()=>$('#dlg').close();
    $('#qa').onclick=()=>{$('#pa').value=11; $('#pb').focus();};
    $('#qb').onclick=()=>{$('#pb').value=11; $('#pa').focus();};
    const send=async body=>{ try{ const s=await api('api/score',Object.assign({stage,id:m.id},body)); S=s; lastRev=s.rev; $('#dlg').close(); toast(body.sa===null?tr('Wynik usunięty.','Result removed.'):tr('Wynik zapisany.','Result saved.')); }catch(e){ $('#derr').textContent=te(e.message); } };
    $('#dok').onclick=()=>{const a=parseInt($('#pa').value,10), b=parseInt($('#pb').value,10);
      if(!Number.isInteger(a)||!Number.isInteger(b)){ $('#derr').textContent=tr('Wpisz punkty obu zawodników.','Enter the points of both players.'); return; }
      send({pa:a,pb:b});};
    const c=$('#dclr'); if(c) c.onclick=()=>send({sa:null,sb:null});
    setTimeout(()=>$('#pa').focus(),50);
  });
}
function confirmBox(what){
  const [act,to]=what.split(':');
  const txt={
    reset:[tr('Nowy turniej?','New tournament?'),tr('Wszystkie mecze zostaną usunięte. Możesz zachować listę zapisanych osób.','All matches will be deleted. You can keep the list of signed-up players.')],
    reopen:[tr('Wrócić do zapisów?','Back to sign-ups?'),tr('Usunie losowanie i wszystkie wyniki. Lista zawodników zostaje.','This removes the draw and all results. The player list stays.')],
    rollback:[to==='ll'?tr('Cofnąć do Lucky Losers?','Roll back to Lucky Losers?'):tr(`Cofnąć do rundy ${to==='r1'?'1':'2'}?`,`Roll back to round ${to==='r1'?'1':'2'}?`),
      to==='r1'?tr('Usunie rundę 2, Lucky Losers i drabinkę. Wyniki rundy 1 zostają.','This removes round 2, Lucky Losers and the bracket. Round 1 results stay.')
      :to==='r2'?tr('Usunie Lucky Losers i drabinkę. Wyniki rund 1 i 2 zostają.','This removes Lucky Losers and the bracket. Round 1 and 2 results stay.')
      :tr('Usunie drabinkę. Wyniki Lucky Losers zostają.','This removes the bracket. Lucky Losers results stay.')]}[act];
  showDlg(`<h3>${txt[0]}</h3><p class="sub">${txt[1]}</p><div class="err" id="derr"></div><div class="row">
    <button type="button" class="ghost" id="dcan">${tr('Anuluj','Cancel')}</button>
    ${act==='reset'?`<button type="button" class="ghost danger" id="dok2">${tr('Wyczyść też zawodników','Clear players too')}</button><button type="button" class="btn" id="dok">${tr('Zachowaj zawodników','Keep players')}</button>`:`<button type="button" class="btn" id="dok">${tr('Tak, cofnij','Yes, roll back')}</button>`}</div>`,
  f=>{ $('#dcan').onclick=()=>$('#dlg').close();
    const go=async body=>{try{const s=await api('api/admin',body);S=s;lastRev=s.rev;$('#dlg').close();{const a=$('#adm'); if(a&&a.open) a.close();}toast(tr('Gotowe.','Done.'));}catch(e){$('#derr').textContent=te(e.message)}};
    $('#dok').onclick=()=>go(act==='reset'?{action:'reset',keepPlayers:true}:act==='rollback'?{action:'rollback',to}:{action:'reopen'});
    const d2=$('#dok2'); if(d2) d2.onclick=()=>go({action:'reset',keepPlayers:false});
  });
}
function renameBox(id){
  showDlg(`<h3>${tr('Zmień imię','Rename player')}</h3><label class="f" style="margin-top:12px">${tr('Imię w drabince','Name in the bracket')}<input id="rn" maxlength="28" value="${esc(name(id))}"></label><div class="err" id="derr"></div>
  <div class="row"><button type="button" class="ghost" id="dcan">${tr('Anuluj','Cancel')}</button><button type="button" class="btn" id="dok">${tr('Zapisz','Save')}</button></div>`,
  f=>{ $('#dcan').onclick=()=>$('#dlg').close();
    $('#dok').onclick=async()=>{try{const s=await api('api/admin',{action:'rename',id,name:$('#rn').value});S=s;lastRev=s.rev;$('#dlg').close();toast(tr('Zmieniono imię.','Name changed.'))}catch(e){$('#derr').textContent=te(e.message)}}; });
}

document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
applyStatic();
(async()=>{ if(DEMO) await demoBoot(); refresh(true); })();
</script>
</body>
